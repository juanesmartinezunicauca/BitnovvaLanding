<section id="team" class="team-section section">
    <div class="container">
        <h2 class="section-title text-gradient">Nuestro Equipo</h2>
        <p class="section-subtitle">Expertos en tecnología de vanguardia</p>

        <div class="team-grid">
            @for (member of teamMembers; track member.name) {
            <div class="team-card neon-border animate-fadeInUp" appWaveEffect [style.animation-delay]="member.delay">
                <div class="member-visual">
                    <div class="model-placeholder">
                        <app-avatar-3d [color]="member.color" [shape]="member.shape"
                            [modelUrl]="member.modelUrl"></app-avatar-3d>
                    </div>
                </div>
                <div class="member-info">
                    <h3 class="member-name">{{ member.name }}</h3>
                    <p class="member-role">{{ member.role }}</p>
                    <div class="member-skills">
                        @for (skill of member.skills; track skill) {
                        <span class="skill-tag">{{ skill }}</span>
                        }
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
